<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#061325" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="dnaGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="dnaGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="12" />

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0,50 L1200,50 M0,100 L1200,100 M0,150 L1200,150 M0,200 L1200,200 M0,250 L1200,250" />
    <path d="M200,0 L200,300 M400,0 L400,300 M600,0 L600,300 M800,0 L800,300 M1000,0 L1000,300" />
  </g>

  <!-- Background Glow Orbs -->
  <circle cx="1020" cy="150" r="130" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="900" cy="80" r="90" fill="#3b82f6" opacity="0.1" filter="url(#glow)" />

  <!-- DNA Double Helix Graphic (Right Side) -->
  <g transform="translate(880, 20)">
    <!-- Base Rungs -->
    <line x1="40" y1="30" x2="140" y2="30" stroke="#10b981" stroke-width="3" opacity="0.5" />
    <line x1="25" y1="60" x2="155" y2="60" stroke="#06b6d4" stroke-width="3" opacity="0.6" />
    <line x1="20" y1="90" x2="160" y2="90" stroke="#3b82f6" stroke-width="3" opacity="0.7" />
    <line x1="25" y1="120" x2="155" y2="120" stroke="#8b5cf6" stroke-width="3" opacity="0.6" />
    <line x1="40" y1="150" x2="140" y2="150" stroke="#10b981" stroke-width="3" opacity="0.5" />
    <line x1="65" y1="180" x2="115" y2="180" stroke="#06b6d4" stroke-width="3" opacity="0.6" />
    <line x1="85" y1="210" x2="95" y2="210" stroke="#3b82f6" stroke-width="3" opacity="0.7" />
    <line x1="65" y1="240" x2="115" y2="240" stroke="#8b5cf6" stroke-width="3" opacity="0.6" />

    <!-- Strand 1 -->
    <path d="M 40,30 Q 15,90 40,150 T 40,270" fill="none" stroke="url(#dnaGrad1)" stroke-width="6" filter="url(#glow)" />

    <!-- Strand 2 -->
    <path d="M 140,30 Q 165,90 140,150 T 140,270" fill="none" stroke="url(#dnaGrad2)" stroke-width="6" filter="url(#glow)" />

    <!-- Base Nodes -->
    <circle cx="40" cy="30" r="6" fill="#10b981" />
    <circle cx="140" cy="30" r="6" fill="#3b82f6" />
    <circle cx="20" cy="90" r="6" fill="#3b82f6" />
    <circle cx="160" cy="90" r="6" fill="#06b6d4" />
    <circle cx="40" cy="150" r="6" fill="#10b981" />
    <circle cx="140" cy="150" r="6" fill="#8b5cf6" />
    <circle cx="20" cy="210" r="6" fill="#06b6d4" />
    <circle cx="160" cy="210" r="6" fill="#10b981" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(70, 0)">
    <!-- Category Badge -->
    <rect x="0" y="42" width="220" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="15" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981" letter-spacing="1.5">BIOTEC-LINE • GENOMICS</text>

    <!-- Main Title -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Genotype-to-VCF <tspan fill="url(#emeraldGrad)">Pro</tspan></text>

    <!-- Subtitle -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">DTC Raw DNA to Standard VCF 4.2 Converter • GRCh37 &amp; GRCh38</text>

    <!-- Feature Badges -->
    <g transform="translate(0, 195)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="160" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">⚡ GRCh37 / GRCh38</text>

      <!-- Badge 2 -->
      <rect x="172" y="0" width="190" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="186" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🧬 23andMe &amp; DTC Exports</text>

      <!-- Badge 3 -->
      <rect x="374" y="0" width="160" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="388" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🔒 Local-First PySide6</text>
    </g>
  </g>
</svg>
