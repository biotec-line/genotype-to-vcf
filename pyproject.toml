[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genotype-to-vcf"
version = "1.0.2"
description = "Local-first DTC DNA genotype export to VCF 4.2 converter with PySide6 GUI & headless CLI"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "biotec-line"}
]
keywords = [
    "23andme",
    "vcf",
    "genomics",
    "bioinformatics",
    "genotype-converter",
    "dnasnp",
    "grch37",
    "grch38",
    "pyside6",
    "local-first"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "PySide6>=6.5.0",
    "pyfaidx>=0.7.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/biotec-line/genotype-to-vcf"
Documentation = "https://github.com/biotec-line/genotype-to-vcf#readme"
Repository = "https://github.com/biotec-line/genotype-to-vcf.git"
Issues = "https://github.com/biotec-line/genotype-to-vcf/issues"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
